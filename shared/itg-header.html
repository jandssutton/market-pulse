<!-- ===========================================================================
 ITG GLOBAL HEADER — shared chrome for every Inside Track tool.
 Matches the Operations Portal header: navy bar, orange underline, logo + name
 on the left, app-switcher + role pill + Sign out on the right. Sits ABOVE each
 tool's own dark body/page title (same pattern as the portal's "Admin Dashboard").

 HOW TO USE (vanilla, no build step):
   1) Paste the <style> block into the page's <style> (or link it once).
   2) Paste the <header> markup as the first element inside <body>.
   3) Paste the <script> block near </body> and set the CONFIG values:
        ITG_HEADER.user   = signed-in name (from Supabase session)
        ITG_HEADER.role   = display role ("Owner", "Marketing", "Reviewer"…)
        ITG_HEADER.logo   = your logo URL (the one used in portal.html)
        ITG_HEADER.signout= sign-out handler/URL
   4) Edit ITG_TOOLS below to match your real tool URLs.
============================================================================ -->

<style>
/* ---- ITG header tokens (brand) ---- */
:root{
  --itg-navy:#15294d;        /* header bar (the navy from the portal) */
  --itg-navy-2:#1d3a68;      /* subtle top sheen */
  --itg-orange:#f2a03d;      /* brand orange underline/accent */
  --itg-teal:#00bfa5;
  --itg-h-ink:#eaf0f8;
  --itg-h-dim:#9fb4d6;
  --itg-pill-a:#7c3aed; --itg-pill-b:#d946ef;   /* role pill gradient */
}
.itg-topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 22px;
  background:linear-gradient(180deg,var(--itg-navy-2),var(--itg-navy));
  border-bottom:3px solid var(--itg-orange);
  font-family:'IBM Plex Sans',sans-serif;
}
.itg-brand{display:flex;align-items:center;gap:12px;min-width:0}
.itg-logo{height:30px;width:auto;display:block;border-radius:6px}
.itg-logo-fallback{display:flex;align-items:center;gap:8px}
.itg-logo-fallback .b{width:30px;height:30px;border-radius:7px;
  background:radial-gradient(circle at 30% 30%,var(--itg-orange),#e35f2a 60%,var(--itg-pill-a));flex:none}
.itg-logo-fallback .w{font-family:'Archivo',sans-serif;font-weight:900;font-size:13px;letter-spacing:.02em;
  color:#fff;line-height:1.05;text-transform:uppercase}
.itg-logo-fallback .w small{display:block;font-size:8.5px;letter-spacing:.22em;color:var(--itg-orange);font-weight:700}
.itg-user{color:var(--itg-teal);font-size:14px;font-weight:600;white-space:nowrap}
.itg-nav{display:flex;align-items:center;gap:14px}
.itg-switch{position:relative}
.itg-switch>button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:var(--itg-h-ink);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;
  padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px}
.itg-switch>button:hover{background:rgba(255,255,255,.11)}
.itg-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;
  background:var(--itg-navy);border:1px solid rgba(255,255,255,.14);border-radius:11px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);padding:7px;display:none}
.itg-menu.open{display:block}
.itg-menu .grp{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--itg-h-dim);padding:9px 11px 4px}
.itg-menu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;
  color:var(--itg-h-ink);text-decoration:none;font-size:13.5px}
.itg-menu a:hover{background:rgba(255,255,255,.08)}
.itg-menu a .ic{width:15px;height:15px;flex:none;opacity:.85}
.itg-menu a.here{color:var(--itg-orange)}
.itg-role{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:12px;color:#fff;
  padding:5px 13px;border-radius:99px;background:linear-gradient(90deg,var(--itg-pill-a),var(--itg-pill-b));
  box-shadow:0 4px 14px rgba(168,85,247,.35);white-space:nowrap}
.itg-signout{color:var(--itg-h-ink);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.itg-signout:hover{color:#fff}
@media(max-width:640px){.itg-user{display:none}.itg-topbar{padding:9px 14px}}
</style>

<header class="itg-topbar">
  <div class="itg-brand">
    <img class="itg-logo" id="itgLogo" alt="Inside Track Garage Doors"
         onerror="this.style.display='none';document.getElementById('itgLogoFb').style.display='flex'">
    <span class="itg-logo-fallback" id="itgLogoFb" style="display:none">
      <span class="b"></span><span class="w">Inside Track<small>Garage Doors</small></span>
    </span>
    <span class="itg-user" id="itgUser"></span>
  </div>
  <nav class="itg-nav">
    <div class="itg-switch">
      <button id="itgSwitchBtn" aria-haspopup="true">
        TOOLS
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="itg-menu" id="itgMenu"></div>
    </div>
    <span class="itg-role" id="itgRole"></span>
    <a class="itg-signout" id="itgSignout">Sign out</a>
  </nav>
</header>

<script>
/* ---- CONFIG: set per deployment ---- */
const ITG_HEADER = {
  user:  'Justin',
  role:  'Owner',
  logo:  'https://insidetrackapps.com/inside-track-web-transparent_logo-color.png',     // <- the logo URL from portal.html
  current: 'market-pulse',           // which tool this page is (highlights it)
  signout: () => { location.href = '/logout'; },
};

/* ---- The tool directory (edit URLs to match your real paths) ---- */
const ITG_TOOLS = [
  { group:'Field Operations', items:[
    { key:'portal',      name:'Operations Portal', url:'/portal.html' },
    { key:'inspection',  name:'Inspection App',    url:'/inspection' },
    { key:'spring',      name:'Spring Calculator', url:'/spring' },
  ]},
  { group:'Marketing & Growth', items:[
    { key:'attribution', name:'Attribution Dashboard', url:'/attribution' },
    { key:'market-pulse',name:'Market Pulse',          url:'/market-pulse' },
  ]},
  { group:'Admin', items:[
    { key:'hub',         name:'All Tools (Hub)',   url:'/hub.html' },
    { key:'careers',     name:'Careers Page',      url:'/careers' },
  ]},
];

(function initHeader(){
  document.getElementById('itgUser').textContent = ITG_HEADER.user || '';
  document.getElementById('itgRole').textContent = ITG_HEADER.role || '';
  const logo = document.getElementById('itgLogo');
  if (ITG_HEADER.logo) logo.src = ITG_HEADER.logo; else logo.dispatchEvent(new Event('error'));
  document.getElementById('itgSignout').onclick = ITG_HEADER.signout;

  // build the app-switcher menu
  const menu = document.getElementById('itgMenu');
  ITG_TOOLS.forEach(g=>{
    const h=document.createElement('div');h.className='grp';h.textContent=g.group;menu.appendChild(h);
    g.items.forEach(it=>{
      const a=document.createElement('a');a.href=it.url;a.textContent=it.name;
      if(it.key===ITG_HEADER.current)a.classList.add('here');
      menu.appendChild(a);
    });
  });
  const btn=document.getElementById('itgSwitchBtn');
  btn.onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
  document.addEventListener('click',()=>menu.classList.remove('open'));
})();
</script>
