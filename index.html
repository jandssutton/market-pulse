<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside Track — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1114;--surface:#14171a;--surface-2:#1b1f24;--line:#262b31;
    --ink:#eef1f4;--ink-dim:#9aa4ad;--ink-faint:#69727b;
    --orange:#f2a03d;--navy:#15294d;--teal:#00bfa5;
    --display:'Archivo',sans-serif;--body:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    background-image:radial-gradient(circle at 12% -8%,rgba(242,160,61,.06),transparent 42%)}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 24px 70px}
  .page-h{margin:6px 0 26px}
  .page-h h1{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em;margin:0}
  .page-h p{color:var(--ink-dim);margin:6px 0 0;font-size:14px}
  .grp-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);
    margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tile{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:18px 18px 16px;position:relative;overflow:hidden;transition:transform .06s,border-color .12s}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent,var(--orange))}
  .tile .top{position:absolute;left:0;top:0;right:0;height:3px;background:var(--accent,var(--orange))}
  .tile .ic{width:30px;height:30px;color:var(--accent,var(--orange));margin-bottom:12px}
  .tile h3{font-family:var(--display);font-weight:800;font-size:16px;margin:0 0 4px;color:var(--ink)}
  .tile p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5}
  .tile .arrow{position:absolute;right:16px;bottom:14px;color:var(--ink-faint)}
  .foot{margin-top:34px;color:var(--ink-faint);font-size:11px;font-family:var(--mono);text-align:center;line-height:1.7}
  @media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.tiles{grid-template-columns:1fr}}
  /* ---- ITG global header (matches Operations Portal) ---- */
  :root{
    --itg-navy:#15294d; --itg-navy-2:#1d3a68; --itg-orange:#f2a03d; --itg-teal:#00bfa5;
    --itg-h-ink:#eaf0f8; --itg-h-dim:#9fb4d6; --itg-pill-a:#7c3aed; --itg-pill-b:#d946ef;
  }
  .itg-topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:10px 22px;background:linear-gradient(180deg,var(--itg-navy-2),var(--itg-navy));
    border-bottom:3px solid var(--itg-orange);font-family:'IBM Plex Sans',sans-serif}
  .itg-brand{display:flex;align-items:center;gap:12px;min-width:0}
  .itg-logo{height:30px;width:auto;display:block;border-radius:6px}
  .itg-logo-fallback{display:flex;align-items:center;gap:8px}
  .itg-logo-fallback .b{width:30px;height:30px;border-radius:7px;background:radial-gradient(circle at 30% 30%,var(--itg-orange),#e35f2a 60%,var(--itg-pill-a));flex:none}
  .itg-logo-fallback .w{font-family:'Archivo',sans-serif;font-weight:900;font-size:13px;letter-spacing:.02em;color:#fff;line-height:1.05;text-transform:uppercase}
  .itg-logo-fallback .w small{display:block;font-size:8.5px;letter-spacing:.22em;color:var(--itg-orange);font-weight:700}
  .itg-user{color:var(--itg-teal);font-size:14px;font-weight:600;white-space:nowrap}
  .itg-nav{display:flex;align-items:center;gap:14px}
  .itg-switch{position:relative}
  .itg-switch>button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--itg-h-ink);
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .itg-switch>button:hover{background:rgba(255,255,255,.11)}
  .itg-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--itg-navy);
    border:1px solid rgba(255,255,255,.14);border-radius:11px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:7px;display:none}
  .itg-menu.open{display:block}
  .itg-menu .grp{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--itg-h-dim);padding:9px 11px 4px}
  .itg-menu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;color:var(--itg-h-ink);text-decoration:none;font-size:13.5px}
  .itg-menu a:hover{background:rgba(255,255,255,.08)}
  .itg-menu a.here{color:var(--itg-orange)}
  .itg-role{font-weight:700;font-size:12px;color:#fff;padding:5px 13px;border-radius:99px;
    background:linear-gradient(90deg,var(--itg-pill-a),var(--itg-pill-b));box-shadow:0 4px 14px rgba(168,85,247,.35);white-space:nowrap}
  .itg-signout{color:var(--itg-h-ink);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .itg-signout:hover{color:#fff}
  @media(max-width:640px){.itg-user{display:none}.itg-topbar{padding:9px 14px}}
</style>
</head>
<body>
<header class="itg-topbar">
  <div class="itg-brand">
    <img class="itg-logo" id="itgLogo" alt="Inside Track Garage Doors"
         onerror="this.style.display='none';document.getElementById('itgLogoFb').style.display='flex'">
    <span class="itg-logo-fallback" id="itgLogoFb" style="display:none">
      <span class="b"></span><span class="w">Inside Track<small>Garage Doors</small></span>
    </span>
    <span class="itg-user" id="itgUser"></span>
  </div>
  <nav class="itg-nav">
    <div class="itg-switch">
      <button id="itgSwitchBtn"><span>TOOLS</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="itg-menu" id="itgMenu"></div>
    </div>
    <span class="itg-role" id="itgRole"></span>
    <a class="itg-signout" id="itgSignout">Sign out</a>
  </nav>
</header>
<div class="wrap">
  <div class="page-h">
    <h1>Inside Track Tools</h1>
    <p id="welcome">Pick a tool to jump in.</p>
  </div>
  <div id="groups"></div>
  <div class="foot">
    One door to every Inside Track app. Each tool enforces its own access — you'll only get in where your role allows.
  </div>
</div>

<script>
/* Who's viewing — wire to the Supabase session. Tiles filter by this role. */
const CURRENT_ROLE = 'admin';   // admin sees everything

/* The tool directory. roles:[] (or omitted) = visible to everyone.
   accent: tile color. Edit url to match your real paths. */
const TOOLS = [
 { group:'Field Operations', tiles:[
   { name:'Operations Portal', desc:'Pre-trip, fleet, inventory, people, incidents.', url:'/portal.html', accent:'#3b82f6', icon:'grid' },
   { name:'Inspection App', desc:'Door safety assessments and history.', url:'/inspection', accent:'#00bfa5', icon:'clipboard' },
   { name:'Spring Calculator', desc:'Field spring matrix tie-breaker.', url:'/spring', accent:'#f2a03d', icon:'wrench' },
 ]},
 { group:'Marketing & Growth', tiles:[
   { name:'Attribution Dashboard', desc:'Spend → lead → job → revenue → reviews.', url:'/attribution', accent:'#25b865', icon:'chart', roles:['admin','manager','partner_viewer','marketing_manager'] },
   { name:'Market Pulse', desc:'Competitor popularity by market.', url:'/market-pulse', accent:'#ff5a1f', icon:'pulse', roles:['admin','marketing_manager','reviewer','read_only_partner'] },
   { name:'Add Social Post', desc:'Log a Facebook / Nextdoor post.', url:'/market-pulse/social-capture.html', accent:'#a855f7', icon:'plus', roles:['admin','marketing_manager','reviewer'] },
 ]},
 { group:'Admin & Hiring', tiles:[
   { name:'Careers Page', desc:'Applicant tracking and public listing.', url:'/careers', accent:'#f2a03d', icon:'user', roles:['admin','manager','marketing_manager'] },
 ]},
];

const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>',
  wrench:'<path d="M14 7a4 4 0 0 0-5 5L4 17l3 3 5-5a4 4 0 0 0 5-5l-3 3-2-2 2-3z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  pulse:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
function svg(name,accent){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+accent+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.grid)+'</svg>';}

(function(){
  const root=document.getElementById('groups');
  TOOLS.forEach(function(g){
    const visible=g.tiles.filter(t=>!t.roles||t.roles.includes(CURRENT_ROLE));
    if(!visible.length)return;
    const h=document.createElement('div');h.className='grp-h';h.textContent=g.group;root.appendChild(h);
    const grid=document.createElement('div');grid.className='tiles';
    visible.forEach(function(t){
      const a=document.createElement('a');a.className='tile';a.href=t.url;a.style.setProperty('--accent',t.accent);
      a.innerHTML='<span class="top"></span>'+svg(t.icon,t.accent)+
        '<h3>'+t.name+'</h3><p>'+t.desc+'</p>'+
        '<svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      grid.appendChild(a);
    });
    root.appendChild(grid);
  });
})();
</script>

<script>
/* ITG header — set these for your deployment */
const ITG_HEADER={ user:'Justin', role:'Owner', logo:'https://insidetrackapps.com/inside-track-web-transparent_logo-color.png', current:'hub',
  signout:()=>{ location.href='/logout'; } };
const ITG_TOOLS=[
 {group:'Field Operations',items:[
   {key:'portal',name:'Operations Portal',url:'/portal.html'},
   {key:'inspection',name:'Inspection App',url:'/inspection'},
   {key:'spring',name:'Spring Calculator',url:'/spring'}]},
 {group:'Marketing & Growth',items:[
   {key:'attribution',name:'Attribution Dashboard',url:'/attribution'},
   {key:'market-pulse',name:'Market Pulse',url:'/market-pulse'},
   {key:'social-capture',name:'Add Social Post',url:'/market-pulse/social-capture.html'}]},
 {group:'Admin',items:[
   {key:'hub',name:'All Tools (Hub)',url:'/hub.html'},
   {key:'careers',name:'Careers Page',url:'/careers'}]},
];
(function(){
  document.getElementById('itgUser').textContent=ITG_HEADER.user||'';
  document.getElementById('itgRole').textContent=ITG_HEADER.role||'';
  var lg=document.getElementById('itgLogo');
  if(ITG_HEADER.logo)lg.src=ITG_HEADER.logo;else lg.dispatchEvent(new Event('error'));
  document.getElementById('itgSignout').onclick=ITG_HEADER.signout;
  var menu=document.getElementById('itgMenu');
  ITG_TOOLS.forEach(function(g){var h=document.createElement('div');h.className='grp';h.textContent=g.group;menu.appendChild(h);
    g.items.forEach(function(it){var a=document.createElement('a');a.href=it.url;a.textContent=it.name;
      if(it.key===ITG_HEADER.current)a.classList.add('here');menu.appendChild(a);});});
  var b=document.getElementById('itgSwitchBtn');
  b.onclick=function(e){e.stopPropagation();menu.classList.toggle('open');};
  document.addEventListener('click',function(){menu.classList.remove('open');});
})();
</script>
</body>
</html>
